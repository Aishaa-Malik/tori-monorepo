# One public entry point, https://bot.toriate.com (docker-compose.yml → nginx):
#   /               web (partner board, wallet, /voice, /api/*)
#   /n8n/           n8n editor, REST and webhooks (needs N8N_PATH=/n8n/ and WEBHOOK_URL=https://bot.toriate.com/n8n/)
#   /voice-bridge/  voice-bridge (/meta/webhook for WhatsApp calls; /calls* need x-bridge-secret)
# The certificate is Let's Encrypt's: scripts/https-init.sh gets the first one, the certbot service renews it.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# plain HTTP: only Let's Encrypt's renewal check, everything else goes to HTTPS
server {
  listen 80 default_server;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://bot.toriate.com$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  http2 on;
  server_name bot.toriate.com;

  ssl_certificate /etc/letsencrypt/live/bot.toriate.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bot.toriate.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  add_header Strict-Transport-Security "max-age=31536000" always;

  client_max_body_size 16m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  # bot replies wait on the LLM
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  location = /n8n {
    return 301 /n8n/;
  }

  # the trailing slash strips /n8n/: n8n itself still serves at its root
  location /n8n/ {
    proxy_pass http://n8n:5678/;
    # n8n's editor push is a long-lived WebSocket
    proxy_buffering off;
  }

  location /voice-bridge/ {
    proxy_pass http://voice-bridge:8099/;
  }

  location / {
    proxy_pass http://web:3000/;
  }
}
